<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <meta name="theme-color" content="#07172f">
  <title>Page Not Found | Cook Services Company, LLC</title>

  <script>
    (function () {
      var path = window.location.pathname || "/";
      var normalized = path.toLowerCase().replace(/\/+$|^$/g, "");

      var redirectPaths = [
        "/board-of-directors",
        "/people"
      ];

      if (redirectPaths.indexOf(normalized) !== -1) {
        window.location.replace("https://corporate.cook-international.com/board-of-directors/");
      }
    })();
  </script>

  <style>
    :root {
      --navy: #07172f;
      --gold: #c9972b;
      --ink: #172033;
      --muted: #667085;
      --line: rgba(7, 23, 47, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 50% 18%, rgba(201,151,43,.13), transparent 26rem),
        linear-gradient(180deg, #fffaf1 0%, #f6f8fb 58%, #eef2f7 100%);
    }

    .wrap {
      width: min(760px, 100%);
      text-align: center;
    }

    .logo-shell {
      width: min(280px, 60vw);
      margin: 0 auto 34px;
      padding: 22px;
      border-radius: 30px;
      background: rgba(255,255,255,.88);
      border: 1px solid rgba(201,151,43,.36);
      box-shadow: 0 30px 80px rgba(7,23,47,.14);
      backdrop-filter: blur(16px);
    }

    .logo-shell img {
      display: block;
      width: 100%;
      height: auto;
      object-fit: contain;
    }

    h1 {
      margin: 0;
      color: var(--navy);
      font-size: clamp(38px, 6vw, 64px);
      line-height: 1;
      letter-spacing: -.045em;
    }

    p {
      margin: 18px auto 0;
      max-width: 560px;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.7;
    }

    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 28px;
      padding: 12px 18px;
      border-radius: 999px;
      background: var(--navy);
      color: #fff;
      text-decoration: none;
      font-weight: 800;
      box-shadow: 0 16px 34px rgba(7,23,47,.18);
    }

    a:hover,
    a:focus {
      background: #102957;
    }
  </style>
</head>

<body>
  <main class="wrap">
    <div class="logo-shell">
      <img src="https://corporate.cook-international.com/CSCLogo01.png" alt="Cook Services Company, LLC">
    </div>

    <h1>Page not found.</h1>
    <p>The page you requested is unavailable or may have moved.</p>

    <a href="/">Return Home</a>
  </main>
</body>
</html>
